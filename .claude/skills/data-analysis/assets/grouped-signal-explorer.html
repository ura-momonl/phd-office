<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>测量数据 · 原始与预处理浏览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6f7;color:#173c36;font:15px system-ui,sans-serif}header{background:#123f35;color:white;padding:22px 30px}h1{margin:0 0 6px;font-size:24px}main{padding:20px;max-width:1600px;margin:auto}.controls{display:flex;gap:15px;flex-wrap:wrap;background:white;border-radius:12px;padding:18px}.controls label{display:grid;gap:7px;min-width:130px}select,button{padding:8px;border:1px solid #a6bab3;border-radius:6px;background:white;color:#173c36}.slider{flex:1;min-width:350px!important}input[type=range]{width:100%;accent-color:#008363}.meta,.finding{background:#e2f1ea;padding:14px;margin:15px 0;border-radius:10px;overflow-wrap:anywhere}.plots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.plot{background:white;border:1px solid #d9e5e1;border-radius:12px;padding:12px}.plot h2{font-size:16px;margin:0 0 5px}canvas{width:100%;height:330px}small{color:#49665f}.legend{font-size:13px;margin:8px 0}.blue{color:#147ab4}.orange{color:#dd6a29}.green{color:#008363}.error{background:#fee;color:#800}footer{font-size:13px;color:#526d65;margin:20px 0}#loading{padding:50px;font-size:22px}@media(max-width:900px){.plots{grid-template-columns:1fr}.slider{min-width:250px!important}}pre{white-space:pre-wrap;font-size:12px}</style>
<header><h1>原始信号 ⇄ 预处理 · 多组数据浏览</h1><div>同一数据层，切换采集次序、驱动响应、复平面与条件变化；不是只看最终均值。</div></header>
<main><div id="loading">正在解压本地数据，无需联网…</div><div id="app" hidden><div class="controls">
<label>配置<select id="config"></select></label><label>通道<select id="channel"></select></label>
<label>展示面<select id="view"><option value="current">驱动响应</option><option value="order">采集次序</option><option value="complex">复平面</option><option value="temperature">同配置条件变化</option></select></label>
<label>处理版本<select id="window"></select></label>
<label class="slider">数据组 <span id="counter"></span><input aria-label="数据组" id="group" type="range" min="0" value="0" step="1"></label><button id="prev">上一组</button><button id="next">下一组</button>
</div><div class="meta" id="meta"></div><div class="legend"><span class="blue">● 逐点原始信号 / 原始复投影</span>　<span class="orange">● 适配器处理后的信号</span>　<span class="green">● 选定处理版本的预计算结果</span></div>
<div class="plots"><section class="plot"><h2 id="title0"></h2><canvas id="plot0" width="1300" height="660"></canvas><small id="caption0"></small></section><section class="plot"><h2 id="title1"></h2><canvas id="plot1" width="1300" height="660"></canvas><small id="caption1"></small></section><section class="plot"><h2 id="title2"></h2><canvas id="plot2" width="1300" height="660"></canvas><small id="caption2"></small></section><section class="plot"><h2 id="title3"></h2><canvas id="plot3" width="1300" height="660"></canvas><small id="caption3"></small></section></div>
<div class="finding" id="finding"></div><details><summary>列名、来源与预处理定义</summary><pre id="provenance"></pre></details><footer id="footnote"></footer></div></main>
<script>__ADAPTER__</script><script id="bundle" type="application/octet-stream">__BUNDLE__</script><script>
const $=id=>document.getElementById(id);let DATA, groups, selected=[];
function preserveEnvelope(points,max=2500){if(points.length<=max)return points;const bins=Math.max(1,Math.floor((max-2)/4)),size=Math.ceil(points.length/bins),indices=new Set([0,points.length-1]);for(let start=0;start<points.length;start+=size){const end=Math.min(points.length,start+size);let minx=start,maxx=start,miny=start,maxy=start;for(let i=start+1;i<end;i++){if(points[i][0]<points[minx][0])minx=i;if(points[i][0]>points[maxx][0])maxx=i;if(points[i][1]<points[miny][1])miny=i;if(points[i][1]>points[maxy][1])maxy=i}for(const i of [minx,maxx,miny,maxy])indices.add(i)}return [...indices].sort((a,b)=>a-b).map(i=>points[i])}
function plot(id,series,xlabel,ylabel){const c=$(id),ctx=c.getContext('2d'),W=c.width,H=c.height,L=100,R=25,T=30,B=95;ctx.clearRect(0,0,W,H);const pts=series.flatMap(s=>s.points).filter(p=>p.every(Number.isFinite));if(!pts.length){ctx.fillText('没有可绘制数值',50,50);return}let xmin=Infinity,xmax=-Infinity,ymin=Infinity,ymax=-Infinity;for(const p of pts){xmin=Math.min(xmin,p[0]);xmax=Math.max(xmax,p[0]);ymin=Math.min(ymin,p[1]);ymax=Math.max(ymax,p[1])}if(xmin===xmax){xmin-=.5;xmax+=.5}if(ymin===ymax){ymin-=.5;ymax+=.5}const pad=(ymax-ymin)*.08;ymin-=pad;ymax+=pad;const X=x=>L+(x-xmin)/(xmax-xmin)*(W-L-R),Y=y=>H-B-(y-ymin)/(ymax-ymin)*(H-T-B);ctx.font='22px system-ui';ctx.strokeStyle='#dae5e0';ctx.fillStyle='#45685c';for(let i=0;i<6;i++){const x=xmin+(xmax-xmin)*i/5,y=ymin+(ymax-ymin)*i/5;ctx.beginPath();ctx.moveTo(X(x),T);ctx.lineTo(X(x),H-B);ctx.stroke();ctx.fillText(x.toPrecision(3),X(x)-25,H-B+30);ctx.beginPath();ctx.moveTo(L,Y(y));ctx.lineTo(W-R,Y(y));ctx.stroke();ctx.fillText(y.toPrecision(3),2,Y(y)+6)}ctx.fillStyle='#173c36';ctx.fillText(xlabel,L+(W-L-R)/2-80,H-20);ctx.fillText(ylabel,L+5,20);let drawn=0;for(const s of series){ctx.fillStyle=s.color;ctx.strokeStyle=s.color;ctx.globalAlpha=s.alpha||.7;if(s.line){ctx.beginPath();s.points.forEach((p,i)=>i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));ctx.stroke()}const shown=preserveEnvelope(s.points);drawn+=shown.length;for(let i=0;i<shown.length;i++){const p=shown[i];ctx.beginPath();ctx.arc(X(p[0]),Y(p[1]),s.radius||3,0,7);ctx.fill()}}ctx.globalAlpha=1;c.dataset.points=pts.length;c.dataset.xrange=JSON.stringify([xmin,xmax]);c.dataset.drawn=drawn;let count=document.getElementById(id+'-count');if(!count){count=document.createElement('div');count.id=id+'-count';count.style='font-size:12px;color:#486b60;margin-top:8px';c.after(count)}count.textContent=`绘图 ${drawn} / ${pts.length} 点`+(drawn<pts.length?'（显示抽稀保留桶内XY极值与原始顺序；分析仍用完整数据）':'（逐点显示）');}
function rowsFor(g,ch){return window.signalAdapter.rows(g,ch,DATA)}
function rebuild(){const value=$('config').value;selected=groups.filter(g=>value==='all'||g.config===value).sort((a,b)=>a.config.localeCompare(b.config)||a.condition-b.condition||a.source.localeCompare(b.source));$('group').max=selected.length-1;$('group').value=0;render()}
function render(){let g=selected[+$('group').value];if(!g)return;const ch=$('channel').value,win=$('window').value,rows=rowsFor(g,ch),steps=g.steps.filter(s=>s.values[ch]?.[win]),detail=window.signalAdapter.details?.(g,ch,win,DATA)||{};let view=$('view').value;const conditionOption=$('view').querySelector('[value="temperature"]');conditionOption.hidden=!Array.isArray(detail.conditionRows)||!detail.conditionRows.length;if(view==='temperature'&&conditionOption.hidden){$('view').value='current';view='current'}const processed=steps.map(s=>({current:s.current,x:s.values[ch][win][0],y:s.values[ch][win][1],phase:Math.atan2(s.values[ch][win][1],s.values[ch][win][0])*180/Math.PI,start:s.start,end:s.end,condition:s.condition}));$('counter').textContent=`${+$('group').value+1} / ${selected.length}（总 ${groups.length} 组）`;$('meta').textContent=`${g.source} · 条件值 ${g.condition.toPrecision(5)} · ${g.rows.length} 行 · ${steps.length}/${g.steps.length} 个数据段有当前处理结果 · ${g.config}`;$('provenance').textContent=JSON.stringify({source:g.path,sha256:g.sha256,columns:g.cols,methods:DATA.methods,preprocessing:DATA.preprocessing,rejected_lines:g.rejected_lines},null,2);const raw='#147ab4',cor='#dd6a29',avg='#008363';let panels=[];
if(view==='temperature'){const matches=detail.conditionRows,xname=detail.conditionLabel||'条件变量（原列单位）';panels=[['同配置实部随条件变化',matches.map(p=>[p.condition,p.x]),xname,'处理后实部'],['同配置虚部随条件变化',matches.map(p=>[p.condition,p.y]),xname,'处理后虚部'],['同配置幅值随条件变化',matches.map(p=>[p.condition,Math.hypot(p.x,p.y)]),xname,'处理后幅值'],['同配置相对相位随条件变化',matches.map(p=>[p.condition,Math.atan2(p.y,p.x)*180/Math.PI]),xname,'相对相位 (°)']];panels.forEach((p,i)=>{ $('title'+i).textContent=p[0];plot('plot'+i,[{points:p[1],color:avg}],p[2],p[3]);$('caption'+i).textContent=detail.conditionNote||`适配器提供 ${matches.length} 个条件比较点。`});}
else if(view==='complex'){panels=[['原始复平面',rows.map(r=>[r.rawx,r.rawy]),'原始实部','原始虚部',raw],['预处理后的复平面',rows.map(r=>[r.x,r.y]),'校正实部','校正虚部',cor],['处理后代表值',processed.map(r=>[r.x,r.y]),'校正实部','校正虚部',avg],['原始幅值与相对相位',rows.map(r=>[r.amplitude,r.delta]),'原始幅值','相对相位 (°)',cor]];panels.forEach((p,i)=>{$('title'+i).textContent=p[0];plot('plot'+i,[{points:p[1],color:p[4]}],p[2],p[3]);$('caption'+i).textContent='同一文件、同一通道；不把相位变化压成无符号幅值。'});}
else {const x=r=>view==='order'?r.i:r.current,xname=view==='order'?'采集行号':'驱动量（原列单位）';const xp=r=>view==='order'?(r.start+r.end)/2:r.current;const defs=[['幅值','amplitude',null,'幅值（原列单位）'],['实部：原始与参考后','rawx','x','实部（原列单位）'],['虚部：原始与参考后','rawy','y','虚部（原列单位）'],['相位：原始与参考后','phase','delta','相位 (°)']];defs.forEach((d,i)=>{let ss=[{points:rows.map(r=>[x(r),r[d[1]]]),color:raw}];if(d[2])ss.push({points:rows.map(r=>[x(r),r[d[2]]]),color:cor});ss.push({points:processed.map(r=>[xp(r),i===0?Math.hypot(r.x,r.y):i===1?r.x:i===2?r.y:r.phase]),color:avg,radius:6});$('title'+i).textContent=d[0];plot('plot'+i,ss,xname,d[3]);$('caption'+i).textContent='蓝/橙保留逐点过程，绿色是选定处理版本的预计算结果；切换版本可比较处理选择。'});}
$('finding').hidden=!detail.finding;$('finding').textContent=detail.finding||'';window.currentSelection={id:g.id,source:g.source,channel:ch,view,window:win};}
async function init(){try{const bytes=Uint8Array.from(atob($('bundle').textContent.trim()),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));DATA=JSON.parse(await new Response(stream).text());groups=DATA.groups;$('footnote').textContent=DATA.display_note||'';$('channel').replaceChildren(...DATA.channels.map(ch=>new Option(ch,ch)));$('window').replaceChildren(...DATA.methods.map(v=>new Option(v.label,v.id)));$('channel').value=DATA.default_channel||DATA.channels[0];$('config').replaceChildren(new Option('全部配置','all'),...[...new Set(groups.map(g=>g.config))].sort().map(c=>new Option(c,c)));$('loading').hidden=true;$('app').hidden=false;rebuild();$('config').onchange=rebuild;for(const id of ['group','channel','window','view'])$(id).addEventListener(id==='group'?'input':'change',render);$('prev').onclick=()=>{$('group').value=Math.max(0,+$('group').value-1);render()};$('next').onclick=()=>{$('group').value=Math.min(selected.length-1,+$('group').value+1);render()};window.explorerReady=true;}catch(e){$('loading').textContent=e.stack;$('loading').className='error';throw e}}init();
</script></html>
