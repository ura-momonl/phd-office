<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIRI · 色彩曲线</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,Microsoft YaHei,sans-serif;background:#141614;color:#e8e9e3}*{box-sizing:border-box}body{max-width:1120px;margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:25px;letter-spacing:.04em;margin:0 0 8px}p{color:#aaaFA7;font-size:14px;line-height:1.6;margin:6px 0}main{display:grid;grid-template-columns:1fr 440px;gap:28px;margin-top:28px}.panel{border:1px solid #343a32;border-radius:16px;padding:20px;background:#1b1e1a}.portraits{display:flex;justify-content:center;gap:20px}.portrait{flex:1;min-width:0;text-align:center}.portrait canvas{display:block;width:100%;max-width:240px;image-rendering:pixelated;background:#1b1917;margin:12px auto;border-radius:8px}label,.label{font-size:13px;color:#b4baaf}button,input{font:inherit}button{border:1px solid #465040;color:#e8e9e3;background:#2b3227;padding:9px 13px;border-radius:8px;cursor:pointer}button:hover{background:#394432}button[aria-pressed=true]{outline:2px solid #9ecb85}button:disabled{opacity:.4;cursor:default}.primary{background:#a0d187;color:#172113;border-color:#a0d187;font-weight:600}.primary:hover{background:#b8e49f}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.channel{min-width:46px}.channel[data-c=r]{color:#ffa099}.channel[data-c=g]{color:#a6dc8c}.channel[data-c=b]{color:#94bdff}svg{width:100%;height:auto;touch-action:none;user-select:none;display:block}svg text{font-size:11px;fill:#aeb6a7}.point{cursor:ns-resize}input[type=number]{width:76px;padding:6px;background:#11150f;border:1px solid #465040;color:#e8e9e3;border-radius:5px}.values{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:12px 0}.legend{display:flex;justify-content:space-between;align-items:center}.swatch{display:inline-block;width:17px;height:17px;vertical-align:middle;border:1px solid #9998;border-radius:3px;margin-right:7px}#hero{width:100%;height:auto;display:block;margin-top:16px;background:#1b1917}#status{min-height:23px;overflow-wrap:anywhere}footer{margin-top:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}#savepath{font-size:12px;color:#8f9a88;overflow-wrap:anywhere}#sample{font-variant-numeric:tabular-nums;font-size:13px}a{color:#b5df9d}@media(max-width:850px){main{grid-template-columns:1fr}body{padding:18px}.panel{padding:16px}header{align-items:flex-start}}
</style></head><body>
<header><div><h1>PIRI / 色彩曲线</h1><p>暗部、中间调、亮部都可以调；默认只将黑描边提到深棕色。</p></div><button id="save" class="primary">保存参数给 Codex</button></header>
<main><section class="panel"><div class="portraits"><div class="portrait"><span class="label">原图</span><canvas id="before" width="64" height="64"></canvas></div><div class="portrait"><span class="label">曲线后</span><canvas id="after" width="64" height="64"></canvas></div></div>
<div class="legend"><label>动画帧 <input id="frame" type="range" min="0" max="8" value="3" aria-label="动画帧"></label><span id="sample"></span></div>
<div class="toolbar" style="margin-top:24px"><span class="label">实际首页渲染预览</span><label><input id="effects" type="checkbox" checked> CRT 效果</label></div><canvas id="hero" aria-label="实际 TUI 渲染预览"></canvas><p>下方预览使用 TUI 同一渲染器；曲线只改角色，不改标题和背景。CRT 本身的光照仍保留。</p></section>
<section class="panel"><div class="toolbar" id="channels"><button class="channel" data-c="r" aria-pressed="true">R</button><button class="channel" data-c="g" aria-pressed="false">G</button><button class="channel" data-c="b" aria-pressed="false">B</button><span class="label">完整 0–255 · 亮部可调</span></div>
<svg id="graph" viewBox="0 0 400 360" role="img" aria-label="拖动控制点调整光滑 RGB 色彩曲线"></svg>
<div class="values"><label>输入 <input id="x" type="number" min="0" max="255" step="1"></label><label>输出 <input id="y" type="number" min="0" max="255" step="1"></label><button id="remove">删除点</button></div><p>拖动圆点；点击空白处加点。曲线平滑且单调，黑白端点可上下移动。横轴为像素最亮通道，纵轴为灰阶标定输出。</p>
<footer><button id="brown">深棕暗部起点</button><button id="identity">还原原色</button></footer><p id="status" role="status">正在加载…</p><div id="savepath"></div><p>保存只留下你的选择，不会立即修改 TUI。调好后告诉 Codex“曲线调好了”。</p></section></main>
<script type="module">
import { CHANNELS, BROWN_CURVES, IDENTITY_CURVES, curveTable, curvePalette, validateCurves } from '/curves.mjs';
const $ = id => document.getElementById(id), colours = {r:'#f09b91',g:'#acd48b',b:'#96bdf3'};
const [state, asset] = await Promise.all(['/state','/asset'].map(async p => {const r=await fetch(p);if(!r.ok)throw Error(await r.text());return r.json();}));
let curves=structuredClone(state.curves), channel='r', selected=0, dragging=false, previewTimer, previewVersion=0;
const frames=asset.frames.map(f=>Uint8Array.from(atob(f), c=>c.charCodeAt(0)));
const graph=$('graph'), NS='http://www.w3.org/2000/svg', X=x=>42+x/255*340, Y=y=>314-y/255*292;
function svg(tag,attrs,text){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;graph.append(e);return e;}
function status(t){$('status').textContent=t;}
function drawGraph(){
 graph.replaceChildren();svg('rect',{x:42,y:22,width:340,height:292,fill:'#12160f',stroke:'#465040'});
 for(const v of [0,64,128,192,255]){svg('line',{x1:X(v),y1:22,x2:X(v),y2:314,stroke:'#36402e','stroke-width':.6});svg('line',{x1:42,y1:Y(v),x2:382,y2:Y(v),stroke:'#36402e','stroke-width':.6});svg('text',{x:X(v),y:331,'text-anchor':'middle'},v);svg('text',{x:33,y:Y(v)+4,'text-anchor':'end'},v);}
 svg('text',{x:212,y:354,'text-anchor':'middle'},'输入 / 0–255');svg('text',{x:8,y:168,transform:'rotate(-90 8 168)','text-anchor':'middle'},'输出 / 0–255');
 svg('line',{x1:X(0),y1:Y(0),x2:X(255),y2:Y(255),stroke:'#68735b','stroke-dasharray':'4 4'});
 for(const c of [...CHANNELS.filter(c=>c!==channel),channel]){const table=curveTable(curves[c]);svg('path',{d:table.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(2)},${Y(v).toFixed(2)}`).join(' '),fill:'none',stroke:colours[c],'stroke-width':c===channel?2.5:1.2,opacity:c===channel?1:.5});}
 curves[channel].forEach(([x,y],i)=>svg('circle',{cx:X(x),cy:Y(y),r:i===selected?6:4.5,fill:i===selected?'#f1f6eb':colours[channel],stroke:'#141614','stroke-width':2,class:'point','data-i':i}));
 const p=curves[channel][selected],last=selected===curves[channel].length-1;$('x').value=p[0];$('y').value=p[1];$('x').disabled=selected===0||last;$('y').disabled=false;$('remove').disabled=selected===0||last;
}
function drawSprite(id,palette){const ctx=$(id).getContext('2d'),im=ctx.createImageData(64,64),fr=frames[+$('frame').value];for(let i=0;i<fr.length;i++)im.data.set(palette[fr[i]],i*4);ctx.putImageData(im,0,0);}
function refresh(){
 validateCurves(curves);drawGraph();const p=curvePalette(asset.palette,curves);drawSprite('before',asset.palette);drawSprite('after',p);
 const black=curvePalette([[0,0,0,255]],curves)[0].slice(0,3),hex='#'+black.map(v=>v.toString(16).padStart(2,'0')).join('');$('sample').replaceChildren();const sw=document.createElement('span');sw.className='swatch';sw.style.background=hex;$('sample').append(sw,hex);
 status('尚未保存 · 暗部和亮部均可调整');clearTimeout(previewTimer);const version=++previewVersion;previewTimer=setTimeout(()=>preview(version),160);
}
async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-Curve-Token':state.token},body:JSON.stringify(data)});if(!r.ok){const e=await r.json();throw Error(e.error);}return r;}
async function preview(version){try{const r=await post('/preview',{curves,effects:$('effects').checked,frame:+$('frame').value});const rgb=new Uint8Array(await r.arrayBuffer());if(version!==previewVersion)return;const c=$('hero');c.width=+r.headers.get('X-Width');c.height=+r.headers.get('X-Height');const ctx=c.getContext('2d'),im=ctx.createImageData(c.width,c.height);for(let i=0,j=0;i<rgb.length;i+=3,j+=4){im.data[j]=rgb[i];im.data[j+1]=rgb[i+1];im.data[j+2]=rgb[i+2];im.data[j+3]=255;}ctx.putImageData(im,0,0);}catch(e){status('预览失败：'+e.message);}}
function coord(e){const rect=graph.getBoundingClientRect();return [((e.clientX-rect.left)/rect.width*400-42)/340*255,(314-(e.clientY-rect.top)/rect.height*360)/292*255];}
function move(x,y){const points=curves[channel],p=points[selected],last=selected===points.length-1;p[0]=selected===0?0:last?255:Math.round(Math.max(points[selected-1][0]+2,Math.min(points[selected+1][0]-2,x)));p[1]=Math.round(Math.max(selected?points[selected-1][1]:0,Math.min(last?255:points[selected+1][1],y)));refresh();}
graph.addEventListener('pointerdown',e=>{let i=e.target.getAttribute('data-i');if(i===null){const [x,y]=coord(e);if(x<2||x>253||y<0||y>255||curves[channel].length>=32)return;const points=curves[channel],at=points.findIndex(p=>p[0]>x);if(x-points[at-1][0]<2||points[at][0]-x<2)return;points.splice(at,0,[Math.round(x),Math.round(Math.max(points[at-1][1],Math.min(points[at][1],y)))]);i=at;}selected=+i;dragging=true;graph.setPointerCapture(e.pointerId);drawGraph();});
graph.addEventListener('pointermove',e=>{if(dragging)move(...coord(e));});graph.addEventListener('pointerup',()=>{if(dragging){dragging=false;refresh();}});graph.addEventListener('pointercancel',()=>{dragging=false;});
$('channels').addEventListener('click',e=>{if(!e.target.dataset.c)return;channel=e.target.dataset.c;selected=Math.min(selected,curves[channel].length-1);for(const b of $('channels').querySelectorAll('button'))b.setAttribute('aria-pressed',b.dataset.c===channel);drawGraph();});
for(const id of ['x','y'])$(id).addEventListener('change',()=>move(+$('x').value,+$('y').value));
$('remove').onclick=()=>{if(selected>0&&selected<curves[channel].length-1){curves[channel].splice(selected,1);selected--;refresh();}};
$('brown').onclick=()=>{curves=structuredClone(BROWN_CURVES);selected=0;refresh();};$('identity').onclick=()=>{curves=structuredClone(IDENTITY_CURVES);selected=0;refresh();};
$('frame').oninput=()=>{drawSprite('before',asset.palette);drawSprite('after',curvePalette(asset.palette,curves));clearTimeout(previewTimer);const v=++previewVersion;previewTimer=setTimeout(()=>preview(v),160);};$('effects').onchange=()=>{const v=++previewVersion;preview(v);};
$('save').onclick=async()=>{try{$('save').disabled=true;const saved=await(await post('/save',{curves})).json();status('已保存 '+new Date(saved.savedAt).toLocaleTimeString()+' · 可以告诉 Codex 读取了');}catch(e){status('保存失败：'+e.message);}finally{$('save').disabled=false;}};
$('savepath').textContent='参数位置：'+state.saveFile;refresh();if(state.savedAt)status('已载入上次保存 · '+new Date(state.savedAt).toLocaleString());
</script></body></html>
