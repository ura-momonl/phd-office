<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>像素陪伴小场景</title><link rel="stylesheet" href="scene-kit.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent;color:#516c61;font:12px/1.6 "Microsoft YaHei",sans-serif}
#frame{box-sizing:border-box;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:60px 0 8px}
#visual{container-type:size;width:100%;flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start}
#scene-status{position:absolute;top:12px;left:20px;right:20px;margin:0;text-align:center}
#stage{width:min(100%,450px,calc(100cqh*344/192));aspect-ratio:344/192;overflow:visible;flex-shrink:0;align-self:flex-start}
</style></head><body>
<div id="frame">
  <div id="visual"><div id="stage"></div></div>
</div>
<p id="scene-status" role="status" aria-live="polite" hidden></p>
<script src="scene-kit.js"></script><script src="scenes/store.js"></script>
<script src="scenes/hall.js"></script><script src="scenes/postapocalyptic.js"></script><script src="scene-picker.js"></script>
<script>
const scenes={
  store:{label:'便利店 · sol',hint:'',config:SCENE_STORE},
  hall:{label:'Backrooms Level 0 · Claude',hint:'',config:SCENE_HALL},
  'sunset-diner':{label:'夕阳旧餐馆 · sol',hint:'',config:SCENE_SUNSET_DINER},
  'rainy-station':{label:'户外旧站台 · Claude',hint:'',config:SCENE_RAINY_STATION}
};
ScenePicker.mount(document.getElementById('stage'),[],document.getElementById('scene-status'),scenes,
  {randomInitial:true,responsive:true,debug:new URLSearchParams(location.search).has('debug'),onChange:h=>{window.__scene=h;}})
  .then(p=>{window.__picker=p;})
  .catch(e=>{const status=document.getElementById('scene-status');status.textContent='场景加载失败：'+e.message;status.hidden=false;});
</script></body></html>
